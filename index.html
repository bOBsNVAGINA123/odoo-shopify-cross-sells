<style>

  .i{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid #c4c4c4;color:#8a8a8a;font-size:10px;align-items:center;justify-content:center;cursor:help}

  .tw{overflow-x:auto}

  .up{color:var(--good)}.dn{color:var(--bad)}.muted{color:var(--soft)}.tiny{font-size:11px;min-height:14px}.warn{color:var(--warn)}

  .kmbar{border-radius:6px 6px 0 0}.kmbar.c{background:#c9ced6}.kmbar.v{background:#426db3}

  .km .mk{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}.km .mk:hover{border-color:#182740}
  .chipG{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700;margin-right:7px;color:#fff}.chipG.c{background:#9aa3ae}.chipG.v{background:#426db3}
  table.sig td{vertical-align:middle}.civ{display:flex;align-items:center;gap:8px;font-size:12px}.citrack{flex:1;height:8px;background:#eef0f3;border-radius:4px;position:relative;min-width:110px}
  .citrack i{position:absolute;top:0;bottom:0;background:#a9bde0;border-radius:4px}.citrack b{position:absolute;top:-3px;width:3px;height:14px;background:#182740;border-radius:2px;margin-left:-1px}
  .mix{display:flex;align-items:center;gap:10px;margin:10px 0}.mix>span{width:120px;font-size:13px;color:var(--soft)}.mix>div{flex:1;display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eef0f3}.mix i{display:block;height:100%}
</style>

<body>
<main>
  <header>
    <div><h1>Odoo Cross Sells</h1><p>Add-ons picked from Odoo baskets, shown on product pages, best sellers and the cart</p></div>
    <div class="seg" id="seg"><button data-d="7">7 days</button><button data-d="14" class="on">14 days</button><button data-d="30">30 days</button><button data-d="90">90 days</button></div>
  </header>
  <div class="seg tabs" id="tabs" style="margin-bottom:14px"><button data-v="online" class="on">Online cross sells</button><button data-v="ab">A/B test</button><button data-v="odoo">Shops vs online (Odoo)</button></div>
  <div id="app"><div class="msg">Loading…</div></div>
</main>
<script>
const FN = 'https://vnrxkekoqftknzjayxpx.supabase.co/functions/v1/okb-stats';
const SRC = { pick: 'Product page picks', best: 'Best sellers tabs', drawer: 'Cart drawer', near: 'Sold out: closest match', qv: 'Pop-up', okb: 'Other' };
const egp = (n) => 'EGP ' + Math.round(n || 0).toLocaleString('en-US');
const num = (n) => Math.round(n || 0).toLocaleString('en-US');
const pct = (a, b, dp = 1) => b ? (100 * a / b).toFixed(dp) + '%' : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = (h) => esc(String(h).replace(/^\d[\w]*?-/, '').replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()));
const tip = (t) => `<span class="i" title="${esc(t)}">i</span>`;
function delta(cur, prev) {
  if (!prev && !cur) return '<span class="d flat">–</span>';
  if (!prev) return '<span class="d flat">new</span>';
  const ch = (cur - prev) / prev * 100, cls = Math.abs(ch) < 0.5 ? 'flat' : ch > 0 ? 'up' : 'down';
  return `<span class="d ${cls}">${ch > 0 ? '↑' : ch < 0 ? '↓' : ''}${Math.abs(ch).toFixed(1)}%</span>`;
}
let days = 14, charts = [], view = 'online', last = null;
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b)); view = b.dataset.v;
  document.getElementById('seg').style.visibility = view === 'online' ? 'visible' : 'hidden'; if (last) show(last);
});
const show = (d) => { const err = view === 'online' ? d.statsErr : view === 'ab' ? d.shErr : (!d.odoo && (d.shErr || d.statsErr));
  if (err) { charts.forEach((c) => c.destroy()); charts = []; document.getElementById('app').innerHTML = `<div class="card msg">${esc(err)} <button onclick="load()">Retry</button></div>`; return; }
  ({ odoo: renderOdoo, ab: renderAB }[view] || render)(d); };
document.getElementById('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b)); days = +b.dataset.d; load();
});

/* Shopify straight from the browser (direct API access, as the staff member who opened the app). */
async function AQ(query, variables) {
  const r = await fetch('shopify:admin/api/2026-10/graphql.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
  const j = await r.json(); if (j.errors) throw new Error(j.errors[0]?.message || 'Shopify error'); return j.data;
}
async function SQ(q) {
  const t = (await AQ('query($q: String!) { shopifyqlQuery(query: $q) { parseErrors tableData { columns { name } rows } } }', { q })).shopifyqlQuery;
  if (t.parseErrors.length) throw new Error(t.parseErrors[0]);
  const cols = t.tableData.columns.map((c) => c.name);
  return t.tableData.rows.map((r) => Array.isArray(r) ? Object.fromEntries(cols.map((c, i) => [c, r[i]])) : r);
}
async function shopifyData() {
  const m = (await AQ('{ currentAppInstallation { id ab: metafield(namespace: "okb", key: "ab") { jsonValue } odoo: metafield(namespace: "okb", key: "odoo") { jsonValue updatedAt } goal: metafield(namespace: "okb", key: "goal") { value updatedAt } } }')).currentAppInstallation;
  const A = m.ab?.jsonValue, out = { owner: m.id, A, odoo: m.odoo, goal: m.goal, ses: [], dly: [] };
  if (A) [out.ses, out.dly] = await Promise.all([
    SQ(`FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout GROUP BY rollout_treatment_id SINCE ${A.start} UNTIL ${A.until}`),
    SQ(`FROM sessions SHOW conversion_rate GROUP BY rollout_treatment_id TIMESERIES day SINCE ${A.start} UNTIL ${A.until}`)]);
  return out;
}
async function trackerStats() {
  const tok = await shopify.idToken();
  const r = await fetch(`${FN}?days=${days}`, { headers: { Authorization: 'Bearer ' + tok }, signal: AbortSignal.timeout(25000) });
  const d = await r.json().catch(() => ({ error: r.status === 504 ? 'busy' : r.status }));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
async function load() {
  const app = document.getElementById('app'); app.style.opacity = .5;
  const [st, sh] = await Promise.allSettled([trackerStats(), shopifyData()]);
  const d = st.status === 'fulfilled' ? st.value : { statsErr: st.reason?.name === 'TimeoutError' || st.reason?.message === 'busy' ? 'The data server is busy right now. Try again in a few minutes.' : 'Could not load: ' + (st.reason?.message || st.reason) };
  if (sh.status === 'fulfilled') { d.sh = sh.value; if (sh.value.odoo?.jsonValue) { d.odoo = sh.value.odoo.jsonValue; d.odoo_at = sh.value.odoo.updatedAt; } }
  else d.shErr = 'Could not read Shopify: ' + (sh.reason?.message || sh.reason);
  last = d; show(d); app.style.opacity = 1;
}

/* A/B test = a Shopify rollout (live theme vs the cross-sell copy). Shopify splits shoppers and counts sessions, cart
   adds, checkouts and conversions per group (read live here). Money comes from Odoo per order (GP on the 4% basis),
   matched to the group by order number in the nightly job. ★ = the goal that decides the test. */
const GOALS = {
  gp_session: { lab: 'Gross profit per session', ps: (x) => [x.gp, x.gp2, x.sessions], f: (v) => 'EGP ' + (+v).toFixed(2), est: 1, tip: 'Odoo gross profit (4% basis) of the group\'s orders ÷ its sessions. The money the test is really about.' },
  rps: { lab: 'Revenue per session', ps: (x) => [x.rev, x.rev2, x.sessions], f: (v) => 'EGP ' + (+v).toFixed(2), est: 1, tip: 'Order revenue (Odoo, VAT in) ÷ sessions.' },
  cvr: { lab: 'Conversion rate', p: (x) => [x.conv, x.sessions], tip: 'Sessions that completed checkout ÷ sessions (Shopify).' },
  atc: { lab: 'Add-to-cart rate', p: (x) => [x.atc, x.sessions], tip: 'Sessions with an add to cart ÷ sessions (Shopify).' },
  checkout: { lab: 'Checkout rate', p: (x) => [x.co, x.sessions], tip: 'Sessions that reached checkout ÷ sessions (Shopify).' },
  aov_capped: { lab: 'AOV, big orders capped', m: (x, c) => [x.rev_c, x.rev_c2, x.orders], f: egp, tip: 'Average order value with orders above the cap counted at the cap, so one huge order cannot decide the test.' },
  aov: { lab: 'AOV', m: (x) => [x.rev, x.rev2, x.orders], f: egp, tip: 'Average order value (Odoo, VAT in).' },
  upt: { lab: 'Items per order', m: (x) => [x.units, x.units2, x.orders], f: (v) => (+v).toFixed(2), tip: 'Units per order (UPT), shipping and gift wrap left out.' },
  multi: { lab: 'Orders with 2+ categories', p: (x) => [x.multi, x.orders], tip: 'Share of orders with items from at least two categories.' },
  cloth_toy: { lab: 'Clothing orders with a toy', p: (x) => [x.cloth_toy, x.cloth], tip: 'Of orders with clothing, the share that also have a toy.' },
};
const erf = (x) => { const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a)); };
const normCdf = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
function val(k, x) {          /* value, standard error, sample size of one group */
  if (!x) return null; const G = GOALS[k];
  if (G.p) { const [a, n] = G.p(x), v = n ? a / n : 0; return { v, se: n ? Math.sqrt(v * (1 - v) / n) : 0, n, f: (y) => (100 * y).toFixed(2) + '%' }; }
  const [sum, sq, n] = (G.ps || G.m)(x), v = n ? sum / n : 0, varr = n > 1 ? Math.max(0, (sq / n - v * v) * n / (n - 1)) : 0;
  return { v, se: n ? Math.sqrt(varr / n) : 0, n, f: G.f };
}
function cmp(k, T, C) {
  const t = val(k, T), c = val(k, C);
  if (!t || !c || !c.v || (T.orders || 0) < 30 || (C.orders || 0) < 30) return null;
  const d = t.v - c.v, se = Math.sqrt(t.se ** 2 + c.se ** 2) || 1e-9, p = normCdf(d / se);
  return { up: d / c.v * 100, lo: (d - 1.96 * se) / c.v * 100, hi: (d + 1.96 * se) / c.v * 100, pBeat: Math.min(99.9, Math.max(0.1, p * 100)), d };
}
async function setGoal(goal) {
  try {
    const r = await AQ('mutation($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { userErrors { message } } }',
      { m: [{ ownerId: last.sh.owner, namespace: 'okb', key: 'goal', type: 'single_line_text_field', value: goal }] });
    if (r.metafieldsSet.userErrors.length) throw new Error(r.metafieldsSet.userErrors[0].message);
    shopify.toast.show('Goal saved'); detail = goal; load();
  } catch (e) { shopify.toast.show('Could not save the goal: ' + e.message, { isError: true }); }
}
let detail = null;
const showDetail = (k) => { detail = k; if (last) renderAB(last); document.getElementById('md')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
const CAT_COL = { Clothing: '#426db3', Toys: '#e0a33a', 'Baby Essentials': '#5fb38a', School: '#8e6cc4', Party: '#e06a7a' };
function renderAB(d) {
  charts.forEach((c) => c.destroy()); charts = [];
  const S = d.sh || {}, A = S.A, app = document.getElementById('app');
  if (!A) { app.innerHTML = '<div class="card empty">A/B numbers arrive with the nightly job.</div>'; return; }
  const sesBy = Object.fromEntries(S.ses.map((r) => [String(r.rollout_treatment_id), r]));
  const G = {}; for (const [id, g] of Object.entries(A.groups)) { const r = sesBy[id] || {}; G[id] = { ...g, sessions: +r.sessions || 0, atc: +r.sessions_with_cart_additions || 0, co: +r.sessions_that_reached_checkout || 0, conv: +r.sessions_that_completed_checkout || 0 }; }
  const running = !!A.rollout, ids = Object.keys(G).sort((a, b) => (G[a].label === 'Test') - (G[b].label === 'Test'));
  const C = running ? G[ids.find((i) => G[i].label === 'Control')] : null, T = running ? G[ids.find((i) => G[i].label === 'Test')] : null;
  const groups = ids.map((id) => [id, G[id].label, G[id].label === 'Test' ? 'With cross sells' : G[id].label === 'Control' ? 'Without cross sells' : 'All shoppers (no test yet)', G[id].label === 'Test' ? 'v' : 'c']);
  const goal = S.goal?.value && GOALS[S.goal.value] ? S.goal.value : 'gp_session', k0 = detail && GOALS[detail] ? detail : goal;
  const nDays = Math.max(1, Math.round((new Date(A.until) - new Date(A.start)) / 864e5) + 1), sesDay = ids.reduce((a, i) => a + G[i].sessions, 0) / nDays;
  const late = running && S.goal?.updatedAt && new Date(S.goal.updatedAt) > new Date(A.start + 'T00:00:00+02:00');
  const srm = running && C && T && (C.sessions + T.sessions) ? (() => { const n = C.sessions + T.sessions, e = T.split / 100, z = (T.sessions - n * e) / Math.sqrt(n * e * (1 - e)); return Math.abs(z) > 3 ? `Traffic split is off: ${pct(T.sessions, n)} of sessions are in Test, ${T.split}% expected. Check the rollout before trusting the numbers.` : ''; })() : '';
  let h = `<div class="card" style="margin-bottom:14px"><div class="hd"><h2>${running ? esc(A.rollout.name) : 'Cross sells vs none'}</h2><span class="badge ${running ? (A.rollout.status === 'ACTIVE' ? 'b-win' : 'b-flat') : 'b-wait'}">${running ? esc(A.rollout.status.toLowerCase()) : 'Not running'}</span></div>` +
    `<div class="abmeta"><span>${running ? `Started <b>${esc(A.start)}</b> · ${nDays} day${nDays > 1 ? 's' : ''}` : 'Start it in Shopify: Online Store → Themes → test the cross-sell copy against the live theme, 50/50'}</span>` +
    (running ? groups.map(([id, short]) => `<span>${short} <b>${esc(G[id].theme)}</b> · ${G[id].split}%</span>`).join('') : `<span>Baseline <b>${esc(A.start)} – ${esc(A.until)}</b></span>`) +
    `<span>★ Goal <b>${esc(GOALS[goal].lab)}</b></span><span>Odoo numbers as of <b>${new Date(A.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</b></span></div>` +
    (srm ? `<div class="note" style="color:#c0262d"><b>${esc(srm)}</b></div>` : '') + (late ? '<div class="note" style="color:#c0262d"><b>The goal was changed after the test started: treat the result with caution.</b></div>' : '') + '</div>';
  h += '<div class="kms">' + Object.keys(GOALS).map((k) => {
    const g = GOALS[k], c = running ? cmp(k, T, C) : null, vals = groups.map(([id]) => val(k, G[id])), mx = Math.max(1e-9, ...vals.map((x) => x ? x.v : 0));
    const est = c && g.est ? c.d * sesDay * 30 : null;
    return `<div class="km${k0 === k ? ' on' : ''}" onclick="showDetail('${k}')" title="${esc(g.tip)}"><div class="t">${k === goal ? '<span class="star">★</span>' : ''}${g.lab}</div>` +
      (c ? `<div class="upl"><span class="${c.up >= 0 ? 'up' : 'dn'}">${c.up >= 0 ? '↑' : '↓'} ${Math.abs(c.up).toFixed(1)}%</span><span class="ci">±${((c.hi - c.lo) / 2).toFixed(1)}</span></div>` +
        (c.lo < 0 && c.hi > 0 ? '<div class="tiny warn">range includes 0, not conclusive</div>' : '<div class="tiny">&nbsp;</div>') + (est != null ? `<div class="est">EST. ${est >= 0 ? '+' : '−'}${egp(Math.abs(est))} / MONTH${k === 'gp_session' ? ' GP' : ''}</div>` : '<div class="est">&nbsp;</div>')

        `<td><div class="civ"><span>${r.f(ci[i][0])}</span><div class="citrack"><i style="left:${(ci[i][0] - lo) / span * 100}%;width:${(ci[i][1] - ci[i][0]) / span * 100}%"></i><b style="left:${(r.v - lo) / span * 100}%"></b></div><span>${r.f(ci[i][1])}</span></div></td></tr>`; }).join('') +
    `</table><div class="note">95% ranges from each group's real spread (per order or per session). A range that includes 0 is not a result. A verdict needs 30+ orders a side; a lift under about 6% needs roughly 4 weeks to show.</div></div>`;
  h += `<div class="card tw" style="margin-top:14px"><div class="hd"><h2>Funnel and money</h2><span>${esc(A.start)} – ${esc(A.until)}</span></div><table><tr><th>Group</th><th>Sessions</th><th>Added to cart</th><th>Reached checkout</th><th>Orders</th><th>Revenue</th><th>Gross profit</th><th>GP per session</th></tr>` +
    groups.map(([id, short, name, cls]) => { const x = G[id]; return `<tr><td><span class="chipG ${cls}">${short[0]}</span>${name}</td><td>${num(x.sessions)}</td><td>${num(x.atc)} <small>${pct(x.atc, x.sessions)}</small></td><td>${num(x.co)} <small>${pct(x.co, x.sessions)}</small></td><td>${num(x.orders)} <small>${pct(x.orders, x.sessions, 2)}</small></td><td>${egp(x.rev)}</td><td>${egp(x.gp)}</td><td>EGP ${(x.sessions ? x.gp / x.sessions : 0).toFixed(2)}</td></tr>`; }).join('') +

  const mixRow = ([id, , name]) => { const m = G[id].mix || {}, tot = Object.values(m).reduce((a, b) => a + b, 0) || 1, keys = Object.keys(m).sort((a, b) => m[b] - m[a]);
    return `<div class="mix"><span>${name}</span><div>${keys.map((c) => `<i title="${esc(c)}: ${pct(m[c], tot)} · ${egp(m[c])}" style="width:${100 * m[c] / tot}%;background:${CAT_COL[c] || '#c9ced6'}"></i>`).join('')}</div></div>`; };
  const legend = [...new Set(groups.flatMap(([id]) => Object.keys(G[id].mix || {})))].filter((c) => CAT_COL[c]);

    `<div class="note">${legend.map((c) => `<span class="chip" style="background:${CAT_COL[c]};color:#fff">${esc(c)}</span>`).join(' ')} <span class="chip" style="background:#c9ced6;color:#fff">Other</span> Hover a block for its share.</div></div>` +

function render(d) {

    card('Orders with a cross sell', num(k.orders), delta(k.orders, k.orders_prev), `${pct(k.orders, k.web_orders)} of ${num(k.web_orders)} web orders`, 'Web orders containing at least one item added from our tiles.') +

  const F = [['Seen', k.views], ['Clicked', k.clicks], ['Added', k.adds], ['Sold', k.units]], fmax = Math.max(1, ...F.map((x) => x[1]));

/* Shops vs online, straight from Odoo (refreshed nightly by the picks job). Every rate shows x of n. */
