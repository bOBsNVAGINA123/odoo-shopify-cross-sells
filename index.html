<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odoo Cross Sells</title>
<!-- Embedded Shopify admin page. Holds NO data: numbers come from the okb-stats function, which only answers
     a valid Shopify session token for this app (client id below). -->
<meta name="shopify-api-key" content="2062428c9eafbbf40a2b212ee890bb81">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--ink:#303030;--muted:#616161;--soft:#8a8a8a;--line:#ebebeb;--bg:#f1f1f1;--card:#fff;--blue:#426db3;--blue2:#9db4dc;--grey:#d9dde3;--good:#0a7d42;--bad:#b42318;--warn:#8a5a00}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:20px;margin:0}h1+p{margin:2px 0 0;color:var(--muted)}h2{font-size:14px;margin:0}
  .seg{display:inline-flex;background:#fff;border-radius:10px;box-shadow:0 0 0 1px #d4d4d4;overflow:hidden}
  .seg button{font:inherit;border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink)}.seg button.on{background:#303030;color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.05);padding:16px;min-width:0}
  .kpi .l{color:var(--muted);font-size:12.5px;display:flex;gap:4px;align-items:center}.kpi b{display:block;font-size:21px;margin:4px 0 2px;letter-spacing:-.01em;white-space:nowrap}.kpi b .d{display:inline-block}
  .kpi small{color:var(--soft);font-size:12px}.d{font-size:12px;font-weight:600;margin-left:6px}.d.up{color:var(--good)}.d.down{color:var(--bad)}.d.flat{color:var(--soft)}
  .i{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid #c4c4c4;color:#8a8a8a;font-size:10px;align-items:center;justify-content:center;cursor:help}
  .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}.hd span{color:var(--soft);font-size:12px}
  .row{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:880px){.row,.row2{grid-template-columns:1fr}}
  .chart{position:relative;height:260px}
  table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}th{color:var(--muted);font-weight:600;font-size:12px}tr:last-child td{border-bottom:0}
  .bar{position:relative}.bar i{position:absolute;inset:4px auto 4px 0;background:rgba(66,109,179,.14);border-radius:4px;z-index:0}.bar span{position:relative}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .b-wait{background:#fff4d6;color:var(--warn)}.b-win{background:#dff5e7;color:var(--good)}.b-lose{background:#fde7e6;color:var(--bad)}.b-flat{background:#eef0f3;color:var(--muted)}
  .funnel div{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:8px 0}.funnel em{display:block;height:26px;border-radius:6px;background:var(--blue);min-width:3px}
  .funnel span{color:var(--muted)}.funnel b{text-align:right}
  .note{color:var(--soft);font-size:12px;margin-top:10px}.empty{padding:26px;text-align:center;color:var(--soft)}
  .ord{border-bottom:1px solid var(--line);padding:9px 0}.ord:last-child{border:0}.ord b{font-weight:600}.ord small{color:var(--soft)}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#eef3fb;color:#2c5281;margin-left:6px}
  .msg{padding:40px;text-align:center;color:var(--muted)}
  .card{overflow-x:auto}@media(max-width:600px){.kpi b{font-size:18px;white-space:normal}.kpi b .d{display:block;margin:2px 0 0}.kpis{gap:8px}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Odoo Cross Sells</h1><p>Add-ons picked from Odoo baskets, shown on product pages, best sellers and the cart</p></div>
    <div class="seg" id="seg"><button data-d="7">7 days</button><button data-d="14" class="on">14 days</button><button data-d="30">30 days</button><button data-d="90">90 days</button></div>
  </header>
  <div id="app"><div class="msg">Loading…</div></div>
</main>
<script>
const FN = 'https://vnrxkekoqftknzjayxpx.supabase.co/functions/v1/okb-stats';
const SRC = { pick: 'Product page picks', best: 'Best sellers tabs', drawer: 'Cart drawer', near: 'Sold out: closest match', qv: 'Pop-up', okb: 'Other' };
const egp = (n) => 'EGP ' + Math.round(n || 0).toLocaleString('en-US');
const num = (n) => Math.round(n || 0).toLocaleString('en-US');
const pct = (a, b, dp = 1) => b ? (100 * a / b).toFixed(dp) + '%' : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = (h) => esc(String(h).replace(/^\d[\w]*?-/, '').replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()));
const tip = (t) => `<span class="i" title="${esc(t)}">i</span>`;
function delta(cur, prev) {
  if (!prev && !cur) return '<span class="d flat">–</span>';
  if (!prev) return '<span class="d flat">new</span>';
  const ch = (cur - prev) / prev * 100, cls = Math.abs(ch) < 0.5 ? 'flat' : ch > 0 ? 'up' : 'down';
  return `<span class="d ${cls}">${ch > 0 ? '↑' : ch < 0 ? '↓' : ''}${Math.abs(ch).toFixed(1)}%</span>`;
}
let days = 14, charts = [];
document.getElementById('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b)); days = +b.dataset.d; load();
});

async function load() {
  const app = document.getElementById('app'); app.style.opacity = .5;
  try {
    const tok = await shopify.idToken();
    const r = await fetch(`${FN}?days=${days}`, { headers: { Authorization: 'Bearer ' + tok } });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error === 'not_configured' ? 'The app secret is not set on the server yet (Supabase secret OKB_APP_SECRET).' : (d.error || r.status));
    render(d);
  } catch (e) { app.innerHTML = `<div class="card msg">Could not load: ${esc(e.message || e)}</div>`; }
  app.style.opacity = 1;
}

/* A/B verdict: Welch 95% interval on the AOV difference; under 30 orders a side it says so instead of guessing. */
function verdict(on, off) {
  if (!on || !off || on.orders < 30 || off.orders < 30) return { cls: 'b-wait', txt: 'Not enough orders yet', lift: null };
  const diff = on.aov - off.aov, se = Math.sqrt(on.aov_sd ** 2 / on.orders + off.aov_sd ** 2 / off.orders), lo = diff - 1.96 * se, hi = diff + 1.96 * se;
  const lift = diff / off.aov * 100, range = `${(lo / off.aov * 100).toFixed(1)}% to ${(hi / off.aov * 100).toFixed(1)}%`;
  if (lo > 0) return { cls: 'b-win', txt: 'Higher AOV with cross sells', lift, range };
  if (hi < 0) return { cls: 'b-lose', txt: 'Lower AOV with cross sells', lift, range };
  return { cls: 'b-flat', txt: 'No clear difference yet', lift, range };
}

function render(d) {
  charts.forEach((c) => c.destroy()); charts = [];
  const k = d.kpi, src = (d.sources || []).slice().sort((a, b) => b.revenue - a.revenue || b.views - a.views);
  const g = Object.fromEntries((d.groups || []).map((x) => [x.ab, x])), on = g.on, off = g.off, v = verdict(on, off);
  const card = (label, val, dl, sub, t) => `<div class="card kpi"><div class="l">${label} ${tip(t)}</div><b>${val}${dl}</b><small>${sub}</small></div>`;
  const rpm = k.views ? k.revenue / k.views * 1000 : 0, rpmP = k.views_prev ? k.revenue_prev / k.views_prev * 1000 : 0;
  const none = !k.views && !k.revenue && !k.units, all = g.none || {};
  let h = none ? `<div class="card" style="margin-bottom:14px;background:#eef3fb;box-shadow:none"><b>Waiting for the first data.</b> Numbers start once the new theme (or its 50/50 A/B split) is live. Baseline to beat in this period: <b>${egp(k.web_revenue / Math.max(1, k.web_orders))}</b> AOV and <b>${all.upt ?? '–'}</b> items per order across ${num(k.web_orders)} web orders.</div>` : '';
  h += '<div class="kpis">' +
    card('Cross-sell revenue', egp(k.revenue), delta(k.revenue, k.revenue_prev), `${pct(k.revenue, k.web_revenue)} of web revenue`, 'Sum of order lines added from our tiles (line tag _okb), web orders, placed in the period. Refunds not deducted.') +
    card('Orders with a cross sell', num(k.orders), delta(k.orders, k.orders_prev), `${pct(k.orders, k.web_orders)} of ${num(k.web_orders)} web orders`, 'Web orders containing at least one item added from our tiles.') +
    card('Units added', num(k.units), delta(k.units, k.units_prev), 'cross-sell items sold', 'Quantity of cross-sell lines in orders.') +
    card('Click rate', pct(k.clicks, k.views), delta(k.views ? k.clicks / k.views : 0, k.views_prev ? k.clicks_prev / k.views_prev : 0), `${num(k.clicks)} clicks / ${num(k.views)} seen`, 'Tiles opened ÷ tiles that scrolled into view (each tile counted once per page view).') +
    card('Add-to-cart rate', pct(k.adds, k.views), delta(k.views ? k.adds / k.views : 0, k.views_prev ? k.adds_prev / k.views_prev : 0), `${num(k.adds)} added`, 'Add to cart presses on our tiles ÷ tiles seen.') +
    card('Revenue per 1,000 seen', egp(rpm), delta(rpm, rpmP), `${num(k.pageviews)} product pages`, 'Cross-sell revenue ÷ tiles seen × 1,000. Compares placements fairly.') +
    '</div>';
  h += `<div class="card"><div class="hd"><h2>Cross-sell revenue per day</h2><span>${esc(d.from)} – ${esc(d.to)} · daily</span></div>${none ? '<div class="empty">No cross-sell sales yet.</div>' : '<div class="chart"><canvas id="c1"></canvas></div>'}</div>`;
  const F = [['Seen', k.views], ['Clicked', k.clicks], ['Added', k.adds], ['Sold', k.units]], fmax = Math.max(1, ...F.map((x) => x[1]));
  h += '<div class="row"><div class="card"><div class="hd"><h2>By placement</h2><span>sorted by revenue</span></div><table><tr><th>Placement</th><th>Seen</th><th>Click rate</th><th>Added</th><th>Orders</th><th>Revenue</th><th>Per 1,000 seen</th></tr>' +
    (src.length ? src.map((x) => `<tr><td>${esc(SRC[x.src] || x.src)}</td><td>${num(x.views)}</td><td>${pct(x.clicks, x.views)}</td><td>${num(x.adds)}</td><td>${num(x.orders)}</td><td>${egp(x.revenue)}</td><td>${x.views ? egp(x.revenue / x.views * 1000) : '–'}</td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">Nothing recorded yet. Numbers start once the new theme (or its A/B split) is live.</td></tr>') +
    '</table></div><div class="card"><div class="hd"><h2>Funnel</h2><span>all placements</span></div><div class="funnel">' +
    F.map((x, i) => `<div><span>${x[0]}</span><em style="width:${Math.max(0.6, x[1] / fmax * 100)}%;opacity:${1 - i * 0.18}"></em><b>${num(x[1])}</b></div>`).join('') +
    `</div><div class="note">Seen → clicked ${pct(k.clicks, k.views)} · seen → added ${pct(k.adds, k.views)} · added → sold ${pct(k.units, k.adds)}</div></div></div>`;
  const ab = ['on', 'off', 'none'].filter((x) => g[x]);
  h += `<div class="row"><div class="card"><div class="hd"><h2>A/B test: see cross sells vs not</h2><span class="badge ${v.cls}">${v.txt}</span></div><table><tr><th>Group</th><th>Orders</th><th>AOV</th><th>Items per order</th><th>Revenue</th></tr>` +
    ab.map((x) => `<tr><td>${{ on: 'See cross sells', off: 'Do not see them', none: 'Not in the test' }[x]}</td><td>${num(g[x].orders)}</td><td>${egp(g[x].aov)}</td><td>${g[x].upt}</td><td>${egp(g[x].revenue)}</td></tr>`).join('') + '</table>' +
    `<div class="note">${v.lift == null ? 'Each shopper is put in a group 50/50 and the group is saved on the order. A verdict needs 30+ orders in both groups.' : `AOV ${v.lift >= 0 ? '+' : ''}${v.lift.toFixed(1)}% with cross sells (95% range ${v.range}).`} The control still sees the theme's own cart “Pair Well With”, which reads the same Odoo picks, so the lift is understated.</div></div>` +
    '<div class="card"><div class="hd"><h2>AOV per day</h2><span>with vs without cross sells</span></div>' + (on || off ? '<div class="chart"><canvas id="c2"></canvas></div>' : '<div class="empty">Appears once orders arrive from both A/B groups.</div>') + '</div></div>';
  const ts = d.top_sold || [], tmax = Math.max(1, ...ts.map((x) => x.revenue)), tr = d.top_recommended || [];
  h += '<div class="row2"><div class="card"><div class="hd"><h2>Most sold cross sells</h2><span>by revenue</span></div><table><tr><th>Product</th><th>Orders</th><th>Units</th><th>Revenue</th></tr>' +
    (ts.length ? ts.map((x) => `<tr><td class="bar"><i style="width:${x.revenue / tmax * 100}%"></i><span>${esc(x.title)}</span></td><td>${num(x.orders)}</td><td>${num(x.units)}</td><td>${egp(x.revenue)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No cross-sell sales in this period yet.</td></tr>') +
    '</table></div><div class="card"><div class="hd"><h2>Most recommended</h2><span>most seen tiles</span></div><table><tr><th>Product</th><th>Seen</th><th>Click rate</th><th>Add rate</th></tr>' +
    (tr.length ? tr.map((x) => `<tr><td>${pretty(x.handle)}</td><td>${num(x.views)}</td><td>${pct(x.clicks, x.views)}</td><td>${pct(x.adds, x.views)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No tiles seen in this period yet.</td></tr>') +
    '</table></div></div>';
  const rc = d.recent || [];
  h += '<div class="card" style="margin-top:14px"><div class="hd"><h2>Latest orders with cross sells</h2><span>check any sale against the order</span></div>' +
    (rc.length ? rc.map((o) => `<div class="ord"><b>${esc(o.order)}</b> <small>${new Date(o.ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · order ${egp(o.total)}</small><br>` +
      (o.items || []).map((it) => `${esc(it.title)} × ${it.q} <small>${egp(it.value)}</small><span class="chip">${esc(SRC[it.src] || it.src)}</span>`).join('<br>') + '</div>').join('') : '<div class="empty">No orders with cross sells in this period yet.</div>') +
    '<div class="note">Attribution: an item counts when it was added from one of our tiles (it carries the hidden tag _okb on the order line). No time window, no view-through credit. Web orders only; refunds and cancellations are not deducted.</div></div>';
  document.getElementById('app').innerHTML = h;
  if (none) return;
  const lab = d.daily.map((x) => new Date(x.day).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
  const base = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${egp(c.parsed.y)}` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => num(v) } } } };
  charts.push(new Chart(document.getElementById('c1'), { data: { labels: lab, datasets: [
    { type: 'bar', label: 'Cross-sell revenue', data: d.daily.map((x) => x.revenue), backgroundColor: '#426db3', borderRadius: 4, yAxisID: 'y', order: 2 },
    { type: 'line', label: 'Share of web revenue', data: d.daily.map((x) => x.web ? +(x.revenue / x.web * 100).toFixed(2) : null), borderColor: '#e0a33a', backgroundColor: '#e0a33a', tension: .3, yAxisID: 'y2', order: 1, spanGaps: true }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { callbacks: { label: (c) => c.dataset.yAxisID === 'y2' ? `${c.dataset.label}: ${c.parsed.y}%` : `${c.dataset.label}: ${egp(c.parsed.y)}` } } },
      scales: { x: base.scales.x, y: { ...base.scales.y, beginAtZero: true }, y2: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { callback: (v) => v + '%' } } } } }));
  if (on || off) charts.push(new Chart(document.getElementById('c2'), { type: 'line', data: { labels: lab, datasets: [
    { label: 'With cross sells', data: d.daily.map((x) => x.aov_on), borderColor: '#426db3', backgroundColor: '#426db3', tension: .3, spanGaps: true },
    { label: 'Without', data: d.daily.map((x) => x.aov_off), borderColor: '#9aa3ae', backgroundColor: '#9aa3ae', borderDash: [5, 4], tension: .3, spanGaps: true }] }, options: base }));
}
load();
</script>
</body>
</html>
