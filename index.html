<body>
<main>
  <header>
    <div><h1>Odoo Cross Sells</h1><p>Add-ons picked from Odoo baskets, shown on product pages, best sellers and the cart</p></div>
    <div class="seg" id="seg"><button data-d="7">7 days</button><button data-d="14" class="on">14 days</button><button data-d="30">30 days</button><button data-d="60">60 days</button></div>
  </header>
  <div class="seg tabs" id="tabs" style="margin-bottom:14px"><button data-v="online" class="on">Online cross sells</button><button data-v="ab">A/B test</button><button data-v="odoo">Shops vs online (Odoo)</button></div>
  <div id="app"><div class="msg">Loading…</div></div>
</main>
<script>
const SRC = { pick: 'Product page picks', best: 'Best sellers tabs', drawer: 'Cart drawer', near: 'Sold out: closest match', qv: 'Pop-up', okb: 'Other' };
const egp = (n) => 'EGP ' + Math.round(n || 0).toLocaleString('en-US');
const num = (n) => Math.round(n || 0).toLocaleString('en-US');
const pct = (a, b, dp = 1) => b ? (100 * a / b).toFixed(dp) + '%' : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = (h) => esc(String(h).replace(/^\d[\w]*?-/, '').replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()));
const tip = (t) => `<span class="i" title="${esc(t)}">i</span>`;
function delta(cur, prev) {
  if (!prev && !cur) return '<span class="d flat">–</span>';
  if (!prev) return '<span class="d flat">new</span>';
  const ch = (cur - prev) / prev * 100, cls = Math.abs(ch) < 0.5 ? 'flat' : ch > 0 ? 'up' : 'down';
  return `<span class="d ${cls}">${ch > 0 ? '↑' : ch < 0 ? '↓' : ''}${Math.abs(ch).toFixed(1)}%</span>`;
}
let days = 14, charts = [], view = 'online', last = null;
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b)); view = b.dataset.v;
  document.getElementById('seg').style.visibility = view === 'online' ? 'visible' : 'hidden'; if (last) show(last);
});
const show = (d) => { const err = d.shErr;
  if (err) { charts.forEach((c) => c.destroy()); charts = []; document.getElementById('app').innerHTML = `<div class="card msg">${esc(err)} <button onclick="load()">Retry</button></div>`; return; }
  ({ odoo: renderOdoo, ab: renderAB }[view] || render)(d); };
document.getElementById('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b)); days = +b.dataset.d; if (last) show(last); /* all 60 days are loaded once; the window just re-cuts them */
});

/* Shopify straight from the browser (direct API access, as the staff member who opened the app). */
async function AQ(query, variables) {
  const r = await fetch('shopify:admin/api/2026-10/graphql.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
  const j = await r.json(); if (j.errors) throw new Error(j.errors[0]?.message || 'Shopify error'); return j.data;
}
async function SQ(q) {
  const t = (await AQ('query($q: String!) { shopifyqlQuery(query: $q) { parseErrors tableData { columns { name } rows } } }', { q })).shopifyqlQuery;
  if (t.parseErrors.length) throw new Error(t.parseErrors[0]);
  const cols = t.tableData.columns.map((c) => c.name);
  return t.tableData.rows.map((r) => Array.isArray(r) ? Object.fromEntries(cols.map((c, i) => [c, r[i]])) : r);
}
/* The A/B test, live from Shopify on every open: the running theme test (rollout), and per group the orders placed since it
   started (value at checkout incl. delivery, units, product types). Same rules as the nightly job. */
const TEST_THEME = /basket builders/i;
async function liveAB(cap) {
  const ro = (await AQ(`{ rollouts(first: 25) { nodes { id name status startedAt concludedAt treatments { id split
      changes(first: 5) { nodes { __typename ... on RolloutThemePublishChange { theme { id name } } } } } } } }`)).rollouts.nodes
    .filter((r) => r.startedAt && r.treatments.some((t) => t.changes.nodes.some((c) => c.__typename === 'RolloutThemePublishChange')));
  const r = ro.sort((a, b) => b.startedAt.localeCompare(a.startedAt))[0];
  const cairo = (iso) => new Date(Date.parse(iso) + 2 * 3600e3).toISOString().slice(0, 10), today = cairo(new Date().toISOString());
  const groups = {}; let start, until;
  if (!r) { until = new Date(Date.parse(today) - 864e5).toISOString().slice(0, 10); start = new Date(Date.parse(until) - 13 * 864e5).toISOString().slice(0, 10); groups['0'] = { label: 'Now', theme: 'live theme, no test running', split: 100 }; }
  else {
    start = cairo(r.startedAt); until = r.concludedAt ? cairo(r.concludedAt) : today;
    const th = r.treatments.map((t) => ({ id: t.id.split('/').pop(), split: t.split, theme: t.changes.nodes.find((c) => c.theme)?.theme }));
    const test = th.find((t) => t.theme && (TEST_THEME.test(t.theme.name) || t.theme.id.endsWith('/156358639795'))) || th.find((t) => t.theme) || th[1];
    for (const t of th) groups[t.id] = { label: t === test ? 'Test' : 'Control', theme: t.theme ? t.theme.name : 'current live theme', split: t.split };
  }
  const rows = await SQ(`FROM sales SHOW orders, total_sales, quantity_ordered GROUP BY order_name, rollout_treatment_id, product_type WHERE sales_channel = 'Online Store' SINCE ${start} UNTIL ${until} LIMIT 100000`);
  const po = {};

        <td>${isC || !c ? '<span class="muted">n/a</span>' : `<b>${chance(c.pBeat)}</b>`}</td><td>${c ? `<b>${chance(isC ? 100 - c.pBeat : c.pBeat)}</b>` : '<span class="muted">—</span>'}</td>
        <td><div class="civ"><span class="lo">${r.f(ci[i][0])}</span><div class="citrack"><div class="bar" style="left:${(ci[i][0] - lo) / span * 100}%;width:${(ci[i][1] - ci[i][0]) / span * 100}%"></div><div class="pt" style="left:${(r.v - lo) / span * 100}%"></div></div><span class="hi">${r.f(ci[i][1])}</span></div></td></tr>`; }).join('') +
    `</tbody></table><p class="tiny muted" style="margin-top:10px">95% intervals from each group's own spread (Welch for averages, two-proportion for rates). An interval that <b>includes 0</b> is not a result, however tempting the point estimate looks.</p></div></div>`;
  /* time series */
  h += `<div class="card mb"><div class="hdr"><h2>Conversion rate over time</h2><span class="sp"></span><span class="tiny muted">per day, Shopify sessions</span></div><div class="bd"><div class="chart"><canvas id="c2"></canvas></div></div></div>`;
  /* orders + baskets */
  const cA = running ? cmp('aov', T, C) : null;
  h += `<div class="card mb"><div class="hdr"><h2>Orders</h2><span class="sp"></span><span class="tiny muted">value at checkout incl. delivery · capped at ${egp(A.cap || 6185)} in “AOV, big orders capped”</span></div><div class="tw"><table><thead><tr><th>Group</th><th>Sessions</th><th>Added to cart</th><th>Reached checkout</th><th>Orders</th><th>Revenue</th><th>AOV</th><th>Items / order</th><th>vs control</th></tr></thead><tbody>` +
    arms.map(([x, short, name, cls], i) => `<tr><td><span class="chipG ${cls === 'v' ? 'g1' : ''}" style="display:inline-flex;margin-right:7px">${short[0]}</span><b>${name}</b></td><td>${num(x.sessions)}</td><td>${num(x.atc)} <span class="tiny muted">${pct(x.atc, x.sessions, 2)}</span></td><td>${num(x.co)} <span class="tiny muted">${pct(x.co, x.sessions, 2)}</span></td><td>${num(x.orders)}</td><td>${egp(x.rev)}</td><td>${x.orders ? egp(x.rev / x.orders) : '—'}</td><td>${x.orders ? (x.units / x.orders).toFixed(2) : '—'}</td><td class="${i && cA ? (cA.up >= 0 ? 'up' : 'dn') : 'muted'}">${i && cA ? (cA.up >= 0 ? '+' : '') + cA.up.toFixed(1) + '% AOV' : '—'}</td></tr>`).join('') + '</tbody></table></div></div>';
  const cats = [...new Set(arms.flatMap(([x]) => Object.keys(x.mix || {})))], tots = arms.map(([x]) => Object.values(x.mix || {}).reduce((a, b) => a + b, 0) || 1);
  const crow = cats.map((cn) => [cn, arms.map(([x], i) => (x.mix?.[cn] || 0) / tots[i])]).sort((a, b) => b[1][0] - a[1][0]);
  h += `<div class="card mb"><div class="hdr"><h2>What baskets are made of</h2><span class="sp"></span><span class="tiny muted">share of each group's revenue · 2+ categories: ${arms.map(([x, s]) => `${s} ${pct(x.multi, x.orders)}`).join(', ')} · clothing orders with a toy: ${arms.map(([x, s]) => `${s} ${pct(x.cloth_toy, x.cloth)}`).join(', ')}</span></div><div class="tw"><table><thead><tr><th>Category</th>${arms.map(([, s]) => `<th>${s}</th>`).join('')}${running ? '<th>Test vs control</th>' : ''}<th style="width:34%">Share</th></tr></thead><tbody>` +
    crow.map(([cn, v]) => { const rel = running && v[0] ? (v[1] - v[0]) / v[0] * 100 : null;
      return `<tr><td><b>${esc(cn)}</b></td>${v.map((p) => `<td>${(100 * p).toFixed(1)}%</td>`).join('')}${running ? `<td class="${rel === null ? 'muted' : rel >= 0 ? 'up' : 'dn'}">${rel === null ? '—' : (rel >= 0 ? '+' : '') + rel.toFixed(0) + '%'}</td>` : ''}<td><div style="display:flex;gap:4px">${v.map((p, gi) => `<div class="sigbar" style="flex:1"><i style="width:${100 * p}%;background:${gi === 0 ? 'var(--blue)' : 'var(--navy)'}"></i></div>`).join('')}</div></td></tr>`; }).join('') + '</tbody></table></div></div>';
  h += `<details class="how"><summary>How this is worked out</summary><p>Everything is Shopify. Shopify runs the test (a theme rollout: live theme vs the cross-sell copy) and counts sessions, cart adds, checkouts and conversions for each group. Orders, order value, units and categories (product type) come from Shopify sales per order: only orders placed since the test started, valued at checkout incl. delivery; returns processed later are left out. Online store checkouts only. Gross profit is not in the tool: Export all, and it is worked out from Odoo.</p></details></div>`;
  app.innerHTML = h;
  const days_ = [...new Set(S.dly.map((r) => r.day))].sort(), lab = days_.map((x) => new Date(x).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
  const series = (id) => days_.map((dd) => { const r = S.dly.find((x) => x.day === dd && String(x.rollout_treatment_id) === id); return r ? +(100 * r.conversion_rate).toFixed(2) : null; });
  charts.push(new Chart(document.getElementById('c2'), { type: 'line', data: { labels: lab, datasets: arms.map(([x, s, , cls]) => ({ label: s, data: series(x.id), borderColor: cls === 'v' ? '#1E2A5A' : '#5B8DEF', backgroundColor: cls === 'v' ? '#1E2A5A' : '#5B8DEF', tension: .3, spanGaps: true, pointRadius: 3 })) },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y}%` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => (+v).toFixed(2) + '%' } } } } }));
}
function render(d0) {
  charts.forEach((c) => c.destroy()); charts = [];
  const d = onlineData(d0); if (!d) { document.getElementById('app').innerHTML = '<div class="card empty">Online numbers arrive with the nightly job.</div>'; return; }
  const k = d.kpi, src = (d.sources || []).slice().sort((a, b) => b.revenue - a.revenue || b.views - a.views);
  const card = (label, val, dl, sub, t) => `<div class="card kpi"><div class="l">${label} ${tip(t)}</div><b>${val}${dl}</b><small>${sub}</small></div>`;
  const rpm = k.views ? k.revenue / k.views * 1000 : 0, rpmP = k.views_prev ? k.revenue_prev / k.views_prev * 1000 : 0;
  const live = d.live, none = !live || (!k.views && !k.revenue && !k.units);
  let h = none ? `<div class="card" style="margin-bottom:14px;background:#eef3fb;box-shadow:none"><b>Not live yet.</b> No shopper sees the cross sells until the test (or the theme) goes live. Baseline in this period: <b>${egp(k.web_revenue / Math.max(1, k.web_orders))}</b> AOV across ${num(k.web_orders)} web orders.</div>` : '';
  if (!d.ga4) h += '<div class="card" style="margin-bottom:14px;background:#fff4d6;box-shadow:none">Tile views and clicks are not connected yet (GA4 key missing in the nightly job). Sales below are complete.</div>';
  h += '<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="mk" onclick="exportOnline()">Export all (CSV)</button></div>';
  h += '<div class="kpis">' +
    card('Cross-sell revenue', egp(k.revenue), delta(k.revenue, k.revenue_prev), `${pct(k.revenue, k.web_revenue)} of web revenue`, 'Sum of order lines added from our tiles (line tag _okb), web orders, placed in the period. Refunds not deducted.') +
    card('Orders with a cross sell', num(k.orders), delta(k.orders, k.orders_prev), `${pct(k.orders, k.web_orders)} of ${num(k.web_orders)} web orders`, 'Web orders containing at least one item added from our tiles.') +
    card('Units added', num(k.units), delta(k.units, k.units_prev), 'cross-sell items sold', 'Quantity of cross-sell lines in orders.') +
    card('Click rate', pct(k.clicks, k.views), delta(k.views ? k.clicks / k.views : 0, k.views_prev ? k.clicks_prev / k.views_prev : 0), `${num(k.clicks)} clicks / ${num(k.views)} seen`, 'Tiles opened ÷ tiles that scrolled into view (each tile counted once per page view).') +
    card('Add-to-cart rate', pct(k.adds, k.views), delta(k.views ? k.adds / k.views : 0, k.views_prev ? k.adds_prev / k.views_prev : 0), `${num(k.adds)} added`, 'Add to cart presses on our tiles ÷ tiles seen.') +
    card('Revenue per 1,000 seen', egp(rpm), delta(rpm, rpmP), `${num(k.views)} tiles seen`, 'Cross-sell revenue ÷ tiles seen × 1,000. Compares placements fairly.') +
    '</div>';
  h += `<div class="card"><div class="hd"><h2>Cross-sell revenue per day</h2><span>${esc(d.from)} – ${esc(d.to)} · daily</span></div>${none ? '<div class="empty">No cross-sell sales yet.</div>' : '<div class="chart"><canvas id="c1"></canvas></div>'}</div>`;
  const F = [['Seen', k.views], ['Clicked', k.clicks], ['Added', k.adds], ['Sold', k.units]], fmax = Math.max(1, ...F.map((x) => x[1]));
  h += '<div class="row"><div class="card"><div class="hd"><h2>By placement</h2><span>sorted by revenue</span></div><table><tr><th>Placement</th><th>Seen</th><th>Click rate</th><th>Added</th><th>Orders</th><th>Revenue</th><th>Per 1,000 seen</th></tr>' +
    (src.length ? src.map((x) => `<tr><td>${esc(SRC[x.src] || x.src)}</td><td>${num(x.views)}</td><td>${pct(x.clicks, x.views)}</td><td>${num(x.adds)}</td><td>${num(x.orders)}</td><td>${egp(x.revenue)}</td><td>${x.views ? egp(x.revenue / x.views * 1000) : '–'}</td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">Nothing recorded yet. Numbers start once the new theme (or its A/B split) is live.</td></tr>') +
    '</table></div><div class="card"><div class="hd"><h2>Funnel</h2><span>all placements</span></div><div class="funnel">' +
    F.map((x, i) => `<div><span>${x[0]}</span><em style="width:${Math.max(0.6, x[1] / fmax * 100)}%;opacity:${1 - i * 0.18}"></em><b>${num(x[1])}</b></div>`).join('') +
    `</div><div class="note">Seen → clicked ${pct(k.clicks, k.views)} · seen → added ${pct(k.adds, k.views)} · added → sold ${pct(k.units, k.adds)}</div></div></div>`;
  const ts = d.top_sold || [], tmax = Math.max(1, ...ts.map((x) => x.revenue)), tr = d.top_recommended || [];
  h += '<div class="row2"><div class="card"><div class="hd"><h2>Most sold cross sells</h2><span>by revenue</span></div><table><tr><th>Product</th><th>Orders</th><th>Units</th><th>Revenue</th></tr>' +
    (ts.length ? ts.map((x) => `<tr><td class="bar"><i style="width:${x.revenue / tmax * 100}%"></i><span>${esc(x.title)}</span></td><td>${num(x.orders)}</td><td>${num(x.units)}</td><td>${egp(x.revenue)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No cross-sell sales in this period yet.</td></tr>') +
    '</table></div><div class="card"><div class="hd"><h2>Most recommended</h2><span>most seen tiles</span></div><table><tr><th>Product</th><th>Seen</th><th>Clicks</th><th>Click rate</th></tr>' +
    (tr.length ? tr.map((x) => `<tr><td>${pretty(x.handle)}</td><td>${num(x.views)}</td><td>${num(x.clicks)}</td><td>${pct(x.clicks, x.views)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No tiles seen in this period yet.</td></tr>') +
    '</table></div></div>';
  const rc = d.recent || [];
  h += '<div class="card" style="margin-top:14px"><div class="hd"><h2>Latest orders with cross sells</h2><span>check any sale against the order</span></div>' +
    (rc.length ? rc.map((o) => `<div class="ord"><b>${esc(o.order)}</b> <small>${new Date(o.ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · order ${egp(o.total)}</small><br>` +
      (o.items || []).map((it) => `${esc(it.title)} × ${it.q} <small>${egp(it.value)}</small><span class="chip">${esc(SRC[it.src] || it.src)}</span>`).join('<br>') + '</div>').join('') : '<div class="empty">No orders with cross sells in this period yet.</div>') +
    '<div class="note">Attribution: an item counts when it was added from one of our tiles (it carries the hidden tag _okb on the order line). No time window, no view-through credit. Web orders only (Shopify, last 60 days); refunds and cancellations are not deducted. Tile views and clicks: GA4 list events okb_<placement>; theme previews are not counted.</div></div>';
  document.getElementById('app').innerHTML = h;
  if (none) return;
  const lab = d.daily.map((x) => new Date(x.day).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
  const base = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${egp(c.parsed.y)}` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => num(v) } } } };
  charts.push(new Chart(document.getElementById('c1'), { data: { labels: lab, datasets: [
    { type: 'bar', label: 'Cross-sell revenue', data: d.daily.map((x) => x.revenue), backgroundColor: '#426db3', borderRadius: 4, yAxisID: 'y', order: 2 },
    { type: 'line', label: 'Share of web revenue', data: d.daily.map((x) => x.web ? +(x.revenue / x.web * 100).toFixed(2) : null), borderColor: '#e0a33a', backgroundColor: '#e0a33a', tension: .3, yAxisID: 'y2', order: 1, spanGaps: true }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { callbacks: { label: (c) => c.dataset.yAxisID === 'y2' ? `${c.dataset.label}: ${c.parsed.y}%` : `${c.dataset.label}: ${egp(c.parsed.y)}` } } },
      scales: { x: base.scales.x, y: { ...base.scales.y, beginAtZero: true }, y2: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { callback: (v) => v + '%' } } } } }));
}
/* Shops vs online, straight from Odoo (refreshed nightly by the picks job). Every rate shows x of n. */
const CATS = ['Clothing', 'Toys', 'Baby Essentials', 'School', 'Party'];
function renderOdoo(d) {
  charts.forEach((c) => c.destroy()); charts = [];
  const o = d.odoo, app = document.getElementById('app');
  if (!o) { app.innerHTML = '<div class="card empty">Odoo numbers arrive with the nightly job.</div>'; return; }
  const S = o.channels.shops, O = o.channels.online;
  const vs = (s, on) => { if (!s) return ''; const ch = (on - s) / s * 100; return `<span class="d ${ch < 0 ? 'down' : 'up'}">online ${ch > 0 ? '+' : ''}${ch.toFixed(0)}% vs shops</span>`; };
  const pair = (label, sv, ov, fmt, sub) => { const mx = Math.max(sv, ov) || 1;
    return `<div class="card kpi"><div class="l">${label}</div><div class="cmp"><span>Shops</span><i style="width:${sv / mx * 100}%"></i><b>${fmt(sv)}</b></div><div class="cmp on"><span>Online</span><i style="width:${ov / mx * 100}%"></i><b>${fmt(ov)}</b></div><div>${vs(sv, ov)}</div><small>${sub}</small></div>`; };
  const p1 = (x) => x.toFixed(1) + '%';
  let h = `<div class="card" style="margin-bottom:14px;background:#eef3fb;box-shadow:none">Odoo orders <b>${esc(o.from)} – ${esc(o.to)}</b>: ${num(S.orders)} shop orders (POS) vs ${num(O.orders)} online orders (Shopify, as booked in Odoo). Updated ${new Date(d.odoo_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}.</div>`;
  h += '<div class="kpis">' +
    pair('AOV', S.aov, O.aov, egp, 'average order value incl. VAT') +
    pair('Items per order', S.upt, O.upt, (x) => x.toFixed(2), 'units per order') +
    pair('Orders with 2+ different items', S.multi2 / S.orders * 100, O.multi2 / O.orders * 100, p1, `${num(S.multi2)} of ${num(S.orders)} vs ${num(O.multi2)} of ${num(O.orders)}`) +
    pair('Orders with 5+ units', S.units5 / S.orders * 100, O.units5 / O.orders * 100, p1, `${num(S.units5)} of ${num(S.orders)} vs ${num(O.units5)} of ${num(O.orders)}`) + '</div>';
  const gaps = o.gaps || [], gmax = Math.max(1, ...gaps.map((g) => g.missed));
  const rate = (x, n) => `${n ? (100 * x / n).toFixed(0) : 0}% <small>${num(x)}/${num(n)}</small>`;
  const nm = (p) => p.handle ? `<a href="https://shop-ourkids.com/products/${encodeURIComponent(p.handle)}" target="_blank" rel="noopener" style="color:inherit">${esc(p.name)}</a>` : esc(p.name);
  h += '<div class="card"><div class="hd"><h2>Biggest gaps: bought together in shops, rarely online</h2><span>sorted by missed baskets</span></div><table class="l2"><tr><th>When they buy</th><th>…they also buy</th><th>Shops</th><th>Online</th><th>Missed online baskets</th><th>In picks</th></tr>' +
    (gaps.length ? gaps.map((g) => `<tr><td>${nm(g.a)}</td><td>${nm(g.b)}</td><td>${rate(g.shops_x, g.shops_n)}</td><td>${rate(g.online_x, g.online_n)}</td><td class="bar"><i style="width:${g.missed / gmax * 100}%"></i><span>${num(g.missed)}</span></td><td>${g.live ? '<span class="chip">live</span>' : '<span class="chip off">not yet</span>'}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No gaps found.</td></tr>') +
    `</table><div class="note">Missed online baskets = how many more online orders would have had both items if online matched the shops' rate (${esc(o.from)} – ${esc(o.to)}). A what-if from measured rates, not a forecast. Pairs need 8+ shared orders and 20+ orders with the first item in each channel.</div></div>`;
  const cx = o.category, heat = (x, n) => { const r = n ? x / n : 0; return `style="background:rgba(66,109,179,${Math.min(0.55, r * 1.6).toFixed(2)})"`; };
  const matrix = (lab, m) => `<div class="card"><div class="hd"><h2>${lab}: of orders with… how many also have…</h2></div><table><tr><th></th>${CATS.map((c) => `<th>${c === 'Baby Essentials' ? 'Baby' : c}</th>`).join('')}</tr>` +
    CATS.map((A) => `<tr><td><b>${A === 'Baby Essentials' ? 'Baby' : A}</b> <small>${num(m[A].n)}</small></td>${CATS.map((B) => A === B ? '<td style="color:#ccc">–</td>' : `<td ${heat(m[A][B], m[A].n)}>${m[A].n ? (100 * m[A][B] / m[A].n).toFixed(1) : 0}%</td>`).join('')}</tr>`).join('') + '</table></div>';
  h += `<div class="row2">${matrix('Shops', cx.shops)}${matrix('Online', cx.online)}</div>`;
  const tp = o.pairs_top || [];
  h += '<div class="row"><div class="card"><div class="hd"><h2>Most bought together</h2><span>shops + online</span></div><table><tr><th>Pair</th><th>Orders together</th><th>× more likely</th><th>In picks</th></tr>' +
    tp.map((g) => `<tr><td>${nm(g.a)} <small>+</small> ${nm(g.b)}${g.a.name === g.b.name ? ' <small>(other colour)</small>' : ''}</td><td>${num(g.together)}</td><td>${g.lift}×</td><td>${g.live ? '<span class="chip">live</span>' : '<span class="chip off">not yet</span>'}</td></tr>`).join('') +

  h += `<div class="card"><div class="hd"><h2>Most frequent purchases</h2><span>share of orders</span></div>${top('Shops', o.top_products.shops)}<div style="height:14px"></div>${top('Online', o.top_products.online)}</div></div>`;
  app.innerHTML = h;
}
