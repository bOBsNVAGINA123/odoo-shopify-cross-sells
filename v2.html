<body>
<ui-nav-menu><a href="?p=overview" rel="home">Overview</a><a href="?p=placements">Cross sells</a><a href="?p=ab">A/B test</a><a href="?p=odoo">Shops vs online</a></ui-nav-menu>
<div id="app"><div class="wrap"><s-spinner accessibilityLabel="Loading"></s-spinner></div></div>
<script>
const SRC = { pick: 'Product page picks', best: 'Best sellers tabs', drawer: 'Cart drawer', near: 'Sold out: closest match', qv: 'Pop-up', okb: 'Other' };
const egp = (n) => 'EGP ' + Math.round(n || 0).toLocaleString('en-US');
const num = (n) => Math.round(n || 0).toLocaleString('en-US');
const pct = (a, b, dp = 1) => b ? (100 * a / b).toFixed(dp) + '%' : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = (h) => esc(String(h).replace(/^\d[\w]*?-/, '').replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()));
const tip = (t) => `<span class="i" title="${esc(t)}">i</span>`;
function delta(cur, prev) {
  if (!prev && !cur) return '<span class="d flat">–</span>';
  if (prev == null) return '';                                  /* no comparable earlier period (e.g. before the test) */
  if (!prev) return '<span class="d flat">new</span>';
  const ch = (cur - prev) / prev * 100, cls = Math.abs(ch) < 0.5 ? 'flat' : ch > 0 ? 'up' : 'down';
  return `<span class="d ${cls}">${ch > 0 ? '↑' : ch < 0 ? '↓' : ''}${Math.abs(ch).toFixed(1)}%</span>`;
}
let days = 'start', charts = [], view = 'overview', last = null;
/* Shopify straight from the browser (direct API access, as the staff member who opened the app). */
async function AQ(query, variables) {
  const r = await fetch('shopify:admin/api/2026-10/graphql.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
  const j = await r.json(); if (j.errors) throw new Error(j.errors[0]?.message || 'Shopify error'); return j.data;
}
async function SQ(q) {
  const t = (await AQ('query($q: String!) { shopifyqlQuery(query: $q) { parseErrors tableData { columns { name } rows } } }', { q })).shopifyqlQuery;
  if (t.parseErrors.length) throw new Error(t.parseErrors[0]);
  const cols = t.tableData.columns.map((c) => c.name);
  return t.tableData.rows.map((r) => Array.isArray(r) ? Object.fromEntries(cols.map((c, i) => [c, r[i]])) : r);
}
/* The A/B test, live from Shopify on every open: the running theme test (rollout), and per group the orders placed since it
   started (value at checkout incl. delivery, units, product types). Same rules as the nightly job. */
const TEST_THEME = /basket builders/i;
async function liveAB(cap) {
  const ro = (await AQ(`{ rollouts(first: 25) { nodes { id name status startedAt concludedAt treatments { id split
      changes(first: 5) { nodes { __typename ... on RolloutThemePublishChange { theme { id name } } } } } } } }`)).rollouts.nodes
    .filter((r) => r.startedAt && r.treatments.some((t) => t.changes.nodes.some((c) => c.__typename === 'RolloutThemePublishChange')));
  const r = ro.sort((a, b) => b.startedAt.localeCompare(a.startedAt))[0];
  const cairo = (iso) => new Date(Date.parse(iso) + 2 * 3600e3).toISOString().slice(0, 10), today = cairo(new Date().toISOString());
  const groups = {}; let start, until;
  if (!r) { until = new Date(Date.parse(today) - 864e5).toISOString().slice(0, 10); start = new Date(Date.parse(until) - 13 * 864e5).toISOString().slice(0, 10); groups['0'] = { label: 'Now', theme: 'live theme, no test running', split: 100 }; }
  else {
    start = cairo(r.startedAt); until = r.concludedAt ? cairo(r.concludedAt) : today;
    const th = r.treatments.map((t) => ({ id: t.id.split('/').pop(), split: t.split, theme: t.changes.nodes.find((c) => c.theme)?.theme }));
    const test = th.find((t) => t.theme && (TEST_THEME.test(t.theme.name) || t.theme.id.endsWith('/156358639795'))) || th.find((t) => t.theme) || th[1];
    for (const t of th) groups[t.id] = { label: t === test ? 'Test' : 'Control', theme: t.theme ? t.theme.name : 'current live theme', split: t.split };
  }
  const rows = await SQ(`FROM sales SHOW orders, total_sales, quantity_ordered GROUP BY order_name, rollout_treatment_id, product_type WHERE sales_channel = 'Online Store' SINCE ${start} UNTIL ${until} LIMIT 100000`);
  const po = {};
  for (const x of rows) { const g = String(x.rollout_treatment_id); if (!groups[g]) continue;
    const o = po[x.order_name] ||= { g, placed: false, rev: 0, units: 0, cats: {} }, v = +x.total_sales || 0, q = Math.round(+x.quantity_ordered || 0);
    if (+x.orders > 0) o.placed = true; if (v > 0) o.rev += v; if (q > 0) { o.units += q; if (x.product_type) o.cats[x.product_type] = (o.cats[x.product_type] || 0) + Math.max(v, 0); } }
  const G = Object.fromEntries(Object.entries(groups).map(([id, m]) => [id, { ...m, orders: 0, rev: 0, rev2: 0, rev_c: 0, rev_c2: 0, units: 0, units2: 0, multi: 0, cloth: 0, cloth_toy: 0, mix: {} }]));
  const orders = [];
  for (const [name, o] of Object.entries(po)) { if (!o.placed) continue; const g = G[o.g], v = o.rev, rc = Math.min(v, cap), cats = Object.keys(o.cats);
    g.orders++; g.rev += v; g.rev2 += v * v; g.rev_c += rc; g.rev_c2 += rc * rc; g.units += o.units; g.units2 += o.units ** 2;
    for (const c of cats) g.mix[c] = (g.mix[c] || 0) + o.cats[c];
    if (cats.length >= 2) g.multi++; if (o.cats.Clothing != null) { g.cloth++; if (o.cats.Toys != null) g.cloth_toy++; }
    orders.push([name, o.g, Math.round(v * 100) / 100, o.units, cats.sort().join('|')]); }
  return { rollout: r ? { id: r.id, name: r.name, status: r.status } : null, rolloutStart: r ? r.startedAt : null, start, until, groups: G, orders, at: new Date().toISOString(), cap, live: true };
}
/* Today's cross-sell sales, live: today's web orders and their lines tagged _okb (the nightly job covers earlier days). */
async function liveXs(fromISO) {
  const by = {}, lines = []; let after = null;
  for (let page = 0; page < 40; page++) {
    const q = `query($a: String) { orders(first: 25, after: $a, query: "created_at:>='${fromISO}' source_name:web") { pageInfo { hasNextPage endCursor }
      nodes { name createdAt totalPriceSet { shopMoney { amount } } lineItems(first: 20) { nodes { title quantity discountedTotalSet { shopMoney { amount } } customAttributes { key value } } } } } }`;
    const r = (await AQ(q, { a: after })).orders;
    for (const o of r.nodes) { const xs = o.lineItems.nodes.map((l) => [l, (l.customAttributes.find((a) => a.key === '_okb')?.value || '').split(':')[0]]).filter(([, src]) => src);
      for (const src of new Set(xs.map(([, x]) => x))) (by[src] ||= { orders: 0, units: 0, rev: 0 }).orders++;
      for (const [l, src] of xs) { by[src].units += l.quantity; by[src].rev += +l.discountedTotalSet.shopMoney.amount; lines.push([o.name, o.createdAt, +o.totalPriceSet.shopMoney.amount, l.title, l.quantity, +l.discountedTotalSet.shopMoney.amount, src]); } }
    if (!r.pageInfo.hasNextPage) break; after = r.pageInfo.endCursor;
  }
  return { by, lines };
}
/* Three steps so the screen is never empty or grey: 1) last night's saved numbers (one quick read), 2) live test from
   Shopify, 3) today's cross-sell orders. Each step redraws; a failure in a later step keeps what is already on screen. */
const META_Q = '{ currentAppInstallation { id ab: metafield(namespace: "okb", key: "ab") { jsonValue } odoo: metafield(namespace: "okb", key: "odoo") { jsonValue updatedAt } online: metafield(namespace: "okb", key: "online") { jsonValue } goal: metafield(namespace: "okb", key: "goal") { value updatedAt } } }';
async function sessionsFor(A) {
  return Promise.all([
    SQ(`FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout GROUP BY rollout_treatment_id SINCE ${A.start} UNTIL ${A.until}`),
    SQ(`FROM sessions SHOW sessions, sessions_with_cart_additions, sessions_that_reached_checkout, sessions_that_completed_checkout WHERE session_country = 'Egypt' GROUP BY rollout_treatment_id TIMESERIES day SINCE ${A.start} UNTIL ${A.until}`)]);
}
function paint(d) {
  const y = window.scrollY; last = d;
  try { show(d); } catch (e) { console.error(e); document.getElementById('app').innerHTML = `<div class="card msg" style="color:#c0262d">Display error: ${esc(e.message || e)} <button onclick="load()">Retry</button></div>`; }
  document.getElementById('app').style.opacity = 1; if (y) window.scrollTo(0, y);
}
let loading = false;
async function load() {
  if (loading) return; loading = true;
  document.querySelectorAll('.livepill').forEach((x) => x.textContent = 'Updating…');
  try {
    const m = (await AQ(META_Q)).currentAppInstallation;
    const base = { owner: m.id, odoo: m.odoo, online: m.online, goal: m.goal, ses: last?.sh?.ses || [], dly: last?.sh?.dly || [], xs: last?.sh?.xs || null, A: last?.sh?.A || m.ab?.jsonValue };
    const d = { sh: base }; if (m.odoo?.jsonValue) { d.odoo = m.odoo.jsonValue; d.odoo_at = m.odoo.updatedAt; }
    if (!last) paint(d);                                                     /* step 1: instant */
    const A = await liveAB(6185).catch((e) => { console.warn('live A/B failed', e); return null; }) || base.A;
    if (A) { [base.ses, base.dly] = await sessionsFor(A); base.A = A; }
    paint({ ...d, sh: { ...base } });                                        /* step 2: live test */
    if (A?.rollout) {
      const today = new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10), from = A.start === today ? A.rolloutStart : today + 'T00:00:00+02:00';
      const xs = await liveXs(from).catch((e) => { console.warn('live cross-sell orders failed', e); return null; });
      if (xs) paint({ ...d, sh: { ...base, xs } });                          /* step 3: today's cross-sell orders */
    }
  } catch (e) { paint({ shErr: 'Could not read Shopify: ' + (e.message || e) }); }
  finally { loading = false; document.getElementById('app').style.opacity = 1; }
}

/* A/B test = a Shopify rollout (live theme vs the cross-sell copy). Shopify splits shoppers and counts sessions, cart
   adds, checkouts and conversions per group (read live here); order value, units and categories per group come from
   Shopify sales per order (nightly job). Gross profit is analysed off-line from the export. ★ = the goal that decides the test. */
const GOALS = {
  rps: { lab: 'Revenue per session', ps: (x) => [x.rev, x.rev2, x.sessions], f: (v) => 'EGP ' + (+v).toFixed(2), est: 1, tip: 'Order value at checkout (Shopify, incl. delivery) ÷ sessions. Catches both more orders and bigger orders.' },
  cvr: { lab: 'Conversion rate', p: (x) => [x.conv, x.sessions], tip: 'Sessions that completed checkout ÷ sessions (Shopify).' },
  atc: { lab: 'Add-to-cart rate', p: (x) => [x.atc, x.sessions], tip: 'Sessions with an add to cart ÷ sessions (Shopify).' },
  checkout: { lab: 'Checkout rate', p: (x) => [x.co, x.sessions], tip: 'Sessions that reached checkout ÷ sessions (Shopify).' },
  aov_capped: { lab: 'AOV, big orders capped', m: (x, c) => [x.rev_c, x.rev_c2, x.orders], f: egp, tip: 'Average order value with orders above the cap counted at the cap, so one huge order cannot decide the test.' },
  aov: { lab: 'AOV', m: (x) => [x.rev, x.rev2, x.orders], f: egp, tip: 'Average order value at checkout (Shopify, incl. delivery).' },
  upt: { lab: 'Items per order', m: (x) => [x.units, x.units2, x.orders], f: (v) => (+v).toFixed(2), tip: 'Units per order (UPT), delivery left out.' },
  multi: { lab: 'Orders with 2+ categories', p: (x) => [x.multi, x.orders], tip: 'Share of orders with items from at least two categories.' },
  cloth_toy: { lab: 'Clothing orders with a toy', p: (x) => [x.cloth_toy, x.cloth], tip: 'Of orders with clothing, the share that also have a toy.' },
};
const erf = (x) => { const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a)); };
const normCdf = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
function val(k, x) {          /* value, standard error, sample size of one group */
  if (!x) return null; const G = GOALS[k];
  if (G.p) { const [a, n] = G.p(x), v = n ? a / n : 0; return { v, se: n ? Math.sqrt(v * (1 - v) / n) : 0, n, f: (y) => (100 * y).toFixed(2) + '%' }; }
  const [sum, sq, n] = (G.ps || G.m)(x), v = n ? sum / n : 0, varr = n > 1 ? Math.max(0, (sq / n - v * v) * n / (n - 1)) : 0;
  return { v, se: n ? Math.sqrt(varr / n) : 0, n, f: G.f };
}
function cmp(k, T, C) {
  const t = val(k, T), c = val(k, C);
  if (!t || !c || !c.v || (T.orders || 0) < 30 || (C.orders || 0) < 30) return null;
  const d = t.v - c.v, se = Math.sqrt(t.se ** 2 + c.se ** 2) || 1e-9, p = normCdf(d / se);
  return { up: d / c.v * 100, lo: (d - 1.96 * se) / c.v * 100, hi: (d + 1.96 * se) / c.v * 100, pBeat: Math.min(99.9, Math.max(0.1, p * 100)), d };
}
async function setGoal(goal) {
  try {
    const r = await AQ('mutation($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { userErrors { message } } }',
      { m: [{ ownerId: last.sh.owner, namespace: 'okb', key: 'goal', type: 'single_line_text_field', value: goal }] });
    if (r.metafieldsSet.userErrors.length) throw new Error(r.metafieldsSet.userErrors[0].message);
    shopify.toast.show('Goal saved'); detail = goal; load();
  } catch (e) { shopify.toast.show('Could not save the goal: ' + e.message, { isError: true }); }
}
setInterval(() => { if (view === 'ab' && !document.hidden && last?.sh?.A?.rollout) load(); }, 60000);   /* live while the tab is open */
const fdate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
/* Online tab data = app field okb.online (nightly job: Shopify orders tagged _okb + GA4 tile events), cut to the chosen window. */
function onlineData(d) {
  const O = d.sh?.online?.jsonValue; if (!O) return null;
  const today = new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10), back = (n) => new Date(Date.parse(today) - n * 864e5).toISOString().slice(0, 10);
  /* a running test is where the data starts: windows never reach back before it, and there is no "previous period" to compare */
  const A = d.sh?.A, S0 = A?.rollout ? A.start : null;
  let from = days === 'start' ? (S0 || back(13)) : back(days - 1);
  if (S0 && from < S0) from = S0;
  const span = Math.round((Date.parse(today) - Date.parse(from)) / 864e5) + 1, pf = back(2 * span - 1);
  const inW = (x) => x >= from && x <= today, inP = (x) => x >= pf && x < from, prevOk = !S0 && pf >= O.start;
  const sum = (rows, f, key) => rows.filter((r) => f(r.d)).reduce((a, r) => a + (r[key] || 0), 0);
  const k = {};
  for (const key of ['views', 'clicks', 'adds', 'orders', 'units']) { k[key] = sum(O.rows, inW, key); k[key + '_prev'] = prevOk ? sum(O.rows, inP, key) : null; }

}

function groupsOf(S) {

/* ONE source for every cross-sell number on every page: the saved rows for days before today + today's orders read live.

function xsAgg(S, from) {
  const O = S.online?.jsonValue, t = today(), P = {}, daily = {};
  const add = (src, k, v) => { (P[src] ||= { views: 0, clicks: 0, adds: 0, orders: 0, units: 0, rev: 0 })[k] += v || 0; };
  for (const r of (O?.rows || [])) if (r.d >= from && r.d <= t) {
    add(r.src, 'views', r.views); add(r.src, 'clicks', r.clicks); add(r.src, 'adds', r.adds);
    if (r.d < t) { add(r.src, 'orders', r.orders); add(r.src, 'units', r.units); add(r.src, 'rev', r.rev); daily[r.d] = (daily[r.d] || 0) + r.rev; } }
  for (const [src, x] of Object.entries(S.xs?.by || {})) { add(src, 'orders', x.orders); add(src, 'units', x.units); add(src, 'rev', x.rev); daily[t] = (daily[t] || 0) + x.rev; }
  const X = { views: 0, clicks: 0, adds: 0, orders: 0, units: 0, rev: 0 }; for (const x of Object.values(P)) for (const k in X) X[k] += x[k];
  /* order count across placements: an order with two placements counts once */
  const cd = (iso) => new Date(Date.parse(iso) + 2 * 3600e3).toISOString().slice(0, 10);
  const lines = [...(O?.lines || []).filter((l) => cd(l[1]) >= from && cd(l[1]) < t), ...(S.xs?.lines || []).filter((l) => cd(l[1]) >= t)];
  X.orders = new Set(lines.map((l) => l[0])).size || X.orders;
  /* GA4 visits: all / saw a tile / added one. GA4 cannot split visits by test group, so B's visits = half of all (50/50 test). */
  const V = (O?.visits || []).filter((v) => v.d >= from && v.d <= t).reduce((a, v) => ({ all: a.all + v.all, seen: a.seen + v.seen, added: a.added + v.added }), { all: 0, seen: 0, added: 0 });
  const byO = {}; for (const l of lines) (byO[l[6]] ||= new Set()).add(l[0]); for (const s in P) P[s].ord = byO[s]?.size ?? P[s].orders;
  return { P, X, V, daily, lines, ga4_at: O?.ga4_at || O?.at, liveToday: !!S.xs };
}

    return `<div class="tile"><s-text tone="subdued">${label}</s-text><div class="pb"><span>Shops</span><div class="ftrack"><i style="width:${sv / mx * 100}%;background:${PURPLE}"></i></div><b>${fmt(sv)}</b></div><div class="pb"><span>Online</span><div class="ftrack"><i style="width:${ov / mx * 100}%;background:${PINK}"></i></div><b>${fmt(ov)}</b></div><div class="ts">${ch == null ? '' : `online ${chg(ch, 0)} vs shops · `}${sub}</div></div>`; };
  let h = header('Shops vs online', `Odoo orders ${esc(o.from)} – ${esc(o.to)} · ${num(S.orders)} shop orders vs ${num(O.orders)} online · updated ${tstamp(d.odoo_at)}`) + nav();
  h += '<div class="g4">' + pair('AOV', S.aov, O.aov, egp, 'incl. VAT') + pair('Items per order', S.upt, O.upt, (x) => x.toFixed(2), 'units') + pair('Orders with 2+ different items', S.multi2 / S.orders * 100, O.multi2 / O.orders * 100, p1, `${num(S.multi2)} of ${num(S.orders)} vs ${num(O.multi2)} of ${num(O.orders)}`) + pair('Orders with 5+ units', S.units5 / S.orders * 100, O.units5 / O.orders * 100, p1, `${num(S.units5)} of ${num(S.orders)} vs ${num(O.units5)} of ${num(O.orders)}`) + '</div>';
  const gaps = o.gaps || [], rate = (x, n) => `${n ? (100 * x / n).toFixed(0) : 0}% <span class="ts">${num(x)}/${num(n)}</span>`;
  const nm = (p) => p.handle ? `<a href="https://shop-ourkids.com/products/${encodeURIComponent(p.handle)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
  const live = (x) => x ? '<s-badge tone="success">In picks</s-badge>' : '<s-badge>Not yet</s-badge>';
  h += card('Bought together in shops, rarely online', gaps.length ? `<s-table><s-table-header-row><s-table-header>When they buy</s-table-header><s-table-header>…they also buy</s-table-header><s-table-header format="numeric">Shops</s-table-header><s-table-header format="numeric">Online</s-table-header><s-table-header format="numeric">Missed online baskets</s-table-header><s-table-header>Picks</s-table-header></s-table-header-row><s-table-body>${gaps.map((x) => `<s-table-row><s-table-cell>${nm(x.a)}</s-table-cell><s-table-cell>${nm(x.b)}</s-table-cell><s-table-cell>${rate(x.shops_x, x.shops_n)}</s-table-cell><s-table-cell>${rate(x.online_x, x.online_n)}</s-table-cell><s-table-cell>${num(x.missed)}</s-table-cell><s-table-cell>${live(x.live)}</s-table-cell></s-table-row>`).join('')}</s-table-body></s-table>` : empty('No gaps found.'), '<s-text tone="subdued">sorted by missed baskets</s-text>');
  const CT = ['Clothing', 'Toys', 'Baby Essentials', 'School', 'Party'], cx = o.category, sh = (c) => c === 'Baby Essentials' ? 'Baby' : c;
  const heat = (x, n) => { const r = n ? x / n : 0; return `style="background:rgba(143,126,240,${Math.min(0.6, r * 1.8).toFixed(2)})"`; };
  const matrix = (lab, m) => card(`${lab}: orders with… that also have…`, `<table class="mx"><tr><th></th>${CT.map((c) => `<th>${sh(c)}</th>`).join('')}</tr>${CT.map((a) => `<tr><td><b>${sh(a)}</b> <span class="ts">${num(m[a].n)}</span></td>${CT.map((b) => a === b ? '<td class="muted">–</td>' : `<td ${heat(m[a][b], m[a].n)}>${m[a].n ? (100 * m[a][b] / m[a].n).toFixed(1) : 0}%</td>`).join('')}</tr>`).join('')}</table>`);
  h += `<div class="g2">${matrix('Shops', cx.shops)}${matrix('Online', cx.online)}</div>`;
  const tp = o.pairs_top || [], top = (a) => `<s-table><s-table-header-row><s-table-header>Product</s-table-header><s-table-header format="numeric">Orders</s-table-header></s-table-header-row><s-table-body>${a.slice(0, 10).map((x) => `<s-table-row><s-table-cell>${nm(x)}</s-table-cell><s-table-cell>${num(x.orders)} <span class="ts">${(100 * x.orders / x.of).toFixed(1)}%</span></s-table-cell></s-table-row>`).join('')}</s-table-body></s-table>`;
  h += `<div class="g2">${card('Most bought together', `<s-table><s-table-header-row><s-table-header>Pair</s-table-header><s-table-header format="numeric">Orders together</s-table-header><s-table-header format="numeric">× more likely</s-table-header><s-table-header>Picks</s-table-header></s-table-header-row><s-table-body>${tp.map((x) => `<s-table-row><s-table-cell>${nm(x.a)} + ${nm(x.b)}</s-table-cell><s-table-cell>${num(x.together)}</s-table-cell><s-table-cell>${x.lift}×</s-table-cell><s-table-cell>${live(x.live)}</s-table-cell></s-table-row>`).join('')}</s-table-body></s-table>`, '<s-text tone="subdued">shops + online</s-text>')}${card('Most frequent purchases', `<div class="sub">Shops</div>${top(o.top_products.shops)}<div class="sub mt">Online</div>${top(o.top_products.online)}`, '<s-text tone="subdued">share of orders</s-text>')}</div>`;
  h += how('Straight from Odoo, refreshed nightly. Missed online baskets = how many more online orders would have had both items if online matched the shops’ rate: a what-if from measured rates, not a forecast. Pairs need 8+ shared orders and 20+ orders with the first item in each channel. × more likely = how much more often the second item is in an order with the first than in orders overall.');
  app.innerHTML = `<div class="wrap">${h}</div>`;
}

/* ---------- exports (restored: the live page lost them in an earlier edit) ---------- */
function csv(name, head, rows) {
  const q = (v) => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const blob = new Blob(['﻿' + [head, ...rows].map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportAB() {
  const A = last?.sh?.A; if (!A) return; const sesBy = Object.fromEntries(last.sh.ses.map((r) => [String(r.rollout_treatment_id), r]));
  const lab = (id) => A.groups[id]?.label || id, tag = `${A.start}_${A.until}`;
  csv(`cross-sell-ab-orders_${tag}.csv`, ['order', 'group', 'order_value_egp', 'units', 'categories'], (A.orders || []).map((o) => [o[0], lab(o[1]), o[2], o[3], o[4]]));
  setTimeout(() => csv(`cross-sell-ab-metrics_${tag}.csv`, ['group', 'metric', 'value'], Object.entries(A.groups).flatMap(([id, g]) => { const r = sesBy[id] || {};
    const x = { ...g, sessions: +r.sessions || 0, atc: +r.sessions_with_cart_additions || 0, co: +r.sessions_that_reached_checkout || 0, conv: +r.sessions_that_completed_checkout || 0 };
    return [['sessions', x.sessions], ['added_to_cart', x.atc], ['reached_checkout', x.co], ['completed_checkout', x.conv], ['orders', x.orders], ['revenue_egp', x.rev], ['units', x.units], ['orders_2plus_categories', x.multi], ['clothing_orders', x.cloth], ['clothing_orders_with_toy', x.cloth_toy],
      ...Object.entries(x.mix || {}).map(([c, v]) => ['revenue_' + c.toLowerCase().replace(/\W+/g, '_'), v])].map(([m, v]) => [g.label, m, v]); })), 400);
}
function exportOnline() {
  const S = last?.sh; if (!S?.online?.jsonValue) return; const O = S.online.jsonValue, { lines } = xsAgg(S, O.start);
  csv(`cross-sell-by-day_${O.start}.csv`, ['day', 'placement', 'tiles_seen', 'clicks', 'adds', 'orders', 'units', 'revenue_egp'], O.rows.map((r) => [r.d, r.src, r.views, r.clicks, r.adds, r.orders, r.units, r.rev]));
  setTimeout(() => csv(`cross-sell-order-lines_${O.start}.csv`, ['order', 'time', 'order_total_egp', 'item', 'qty', 'item_value_egp', 'placement'], lines), 400);
}

/* first paint from the last visit while Shopify is read (no grey screen) */
try { const c = JSON.parse(sessionStorage.getItem('okb_last') || 'null'); if (c && !c.shErr) { last = c; show(c); } } catch (e) { /* no cache */ }
load();
